name: release

# Tag push (vX.Y.Z)  → GitHub Release with one ad-hoc signed app per architecture
#                      (Apple silicon and Intel, each as .dmg and .zip; no universal build).
# Manual dispatch    → refreshes the rolling "nightly" pre-release from the chosen ref.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: apple-silicon + intel packages
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Toolchain
        run: |
          swift --version
          sw_vers
      - name: Test
        run: swift test
      - name: Version
        id: version
        run: |
          SOURCE_VERSION="$(sed -n 's/.*static let current = "\(.*\)".*/\1/p' Sources/NikoCore/Version.swift | head -n 1)"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$SOURCE_VERSION" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match Version.swift ($SOURCE_VERSION)"
              exit 1
            fi
            echo "version=$SOURCE_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "version=$SOURCE_VERSION-nightly.$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - name: Rosetta (to start the Intel build on this arm64 runner)
        run: /usr/sbin/softwareupdate --install-rosetta --agree-to-license >/dev/null 2>&1 || true
      - name: Build and verify one package per architecture, ad-hoc signed
        env:
          NIKO_VERSION: ${{ steps.version.outputs.version }}
        # arm64 and x86_64 apps, each as .dmg and .zip; checks architectures,
        # signatures, that the zips unpack and the images mount, and SHA256SUMS.
        run: scripts/make-release.sh
      - name: Both builds must have been started
        run: |
          "dist/apple-silicon/Niko Island.app/Contents/MacOS/niko-island" --version
          arch -x86_64 "dist/intel/Niko Island.app/Contents/MacOS/niko-island" --version
          arch -x86_64 "dist/intel/Niko Island.app/Contents/Helpers/niko-bridge" --integrity-check "dist/intel/Niko Island.app"
      - name: Launch smoke test (Apple silicon build)
        run: scripts/smoke-launch.sh "dist/apple-silicon/Niko Island.app"
      - name: Launch smoke test (Intel build, under Rosetta)
        run: scripts/smoke-launch.sh "dist/intel/Niko Island.app"
      - uses: actions/upload-artifact@v4
        with:
          name: niko-island-${{ steps.version.outputs.version }}
          path: dist/release/*
          if-no-files-found: error
      - name: Release notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          {
            awk -v v="${VERSION%%-nightly*}" '
              $0 ~ "^## \\[" v "\\]" { printing = 1; next }
              printing && /^## \[/ { exit }
              printing { print }
            ' CHANGELOG.md
            echo
            echo "### Install"
            echo
            echo "Pick the download for your Mac (Apple menu → About This Mac): **apple-silicon** for an M-series chip, **intel** for an Intel processor."
            echo "Open the \`.dmg\` and drag **Niko Island** onto **Applications** (the \`.zip\` holds the same app)."
            echo "The app is ad-hoc signed (no Apple Developer account), so clear the quarantine flag once:"
            echo "\`xattr -cr \"/Applications/Niko Island.app\"\`."
            echo "Without a terminal: on macOS 14 right-click the app → **Open**; on macOS 15+ open it once, then System Settings → Privacy & Security → **Open Anyway**."
            echo
            echo "Verify the download with \`shasum -a 256 -c SHA256SUMS\`."
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: Publish tagged release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Niko Island ${{ steps.version.outputs.version }}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # The tag was pushed again (for example after it was moved):
            # refresh the existing release in place instead of failing.
            gh release edit "$GITHUB_REF_NAME" --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md"
            gh release upload "$GITHUB_REF_NAME" dist/release/*.dmg dist/release/*.zip dist/release/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/release/*.dmg dist/release/*.zip dist/release/SHA256SUMS \
              --title "$TITLE" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --verify-tag
          fi
      - name: Publish nightly pre-release
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --cleanup-tag --yes 2>/dev/null || true
          gh release create nightly dist/release/*.dmg dist/release/*.zip dist/release/SHA256SUMS \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Niko Island nightly (${{ steps.version.outputs.version }})" \
            --notes-file "$RUNNER_TEMP/notes.md"
