name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          swift --version
          sw_vers
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test
      - name: Shell lint (generated scripts and repo scripts)
        run: |
          command -v shellcheck >/dev/null || brew install shellcheck
          "$(swift build --show-bin-path)/niko-island" internal dump-scripts "$RUNNER_TEMP/scripts"
          shellcheck --version | head -n 2
          # Run every group so one finding does not hide the others.
          status=0
          shellcheck "$RUNNER_TEMP"/scripts/*.sh || status=1
          shellcheck --shell=bash "$RUNNER_TEMP"/scripts/*.bash || status=1
          shellcheck scripts/*.sh || status=1
          exit "$status"
      - name: Assemble app and disk image (host architecture)
        run: scripts/make-app.sh --dmg
      - name: Bundle self-check
        run: |
          APP="dist/Niko Island.app"
          codesign --verify --deep --strict "$APP"
          "$APP/Contents/Helpers/niko-bridge" --integrity-check "$APP"
          "$APP/Contents/MacOS/niko-island" --version
          mkdir -p "$RUNNER_TEMP/dmg"
          hdiutil attach -nobrowse -readonly -quiet -mountpoint "$RUNNER_TEMP/dmg" dist/*.dmg
          codesign --verify --deep --strict "$RUNNER_TEMP/dmg/Niko Island.app"
          test "$(readlink "$RUNNER_TEMP/dmg/Applications")" = "/Applications"
          hdiutil detach -quiet "$RUNNER_TEMP/dmg"
          (cd dist && shasum -a 256 -c SHA256SUMS)
      - name: Launch smoke test
        run: scripts/smoke-launch.sh
